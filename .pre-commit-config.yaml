repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^backend/uv\.lock$

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend Ruff lint
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: backend-ruff-format
        name: backend Ruff formatting
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: backend-mypy
        name: backend Mypy
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        pass_filenames: false
        files: ^backend/
